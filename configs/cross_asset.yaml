inputs:
  - name: equity_hs300
    asset_class: equity
    path: ../tests/fixtures/index_series.csv
    date_col: date
    value_col: close
  - name: commodity_proxy
    asset_class: futures
    path: ../tests/fixtures/index_series.csv
    date_col: date
    value_col: close

rules:
  vol_window: 20
  vol_lookback: 60
  vol_percentile_threshold: 0.8
  return_window: 20
  risk_off_return: -0.05
  high_vol_scale: 0.5
  risk_off_scale: 0.3
  risk_on_scale: 1.0
  asset_class_weights:
    equity: 0.6
    futures: 0.4
